<!-- ==========================================================================
     THEME  (EDIT ME: colors, fonts, and logo all live in this one block)
     Matches clicker-cafe-brand-kit.html (the founders' palette and logo, Oct 13).
     - Colors: change the hex values. Everything else in the file uses these names.
       Some old names (chalk, tan, chalkboard-2) are kept so the rest of the file
       did not have to change; they now hold shades of the new palette.
     - Fonts: the register must work offline, so these are "named fonts with
       fallbacks". If Fredoka/Nunito are not on the iPad, the fallbacks are used.
     - Logo: --logo-url is the cup (top bar). --logo-full-url is the cup with the
       CLICKER CAFE lettering (sign-in screen). Both are cream versions, because
       they sit on Espresso brown. They are pasted in as data so the file works offline.
       Set either to none to fall back to the company name as text.
   ========================================================================== -->
<style id="theme">
:root{
  /* ---- Brand palette (chosen by the founders) ---- */
  --milk-foam:#FFFEFC;
  --strawberry-milk:#FFD4DE;
  --rose-latte:#E491A5;
  --mocha:#8A6A4F;
  --espresso:#3B2A26;

  /* ---- Supporting shades (lighter/darker steps of the palette) ---- */
  --chalk:var(--milk-foam);    /* light text on dark brown */
  --espresso-2:#4A3631;        /* order board and sign-in background */
  --chalkboard-2:#5C4640;      /* buttons on the dark board */
  --chalkboard-line:#76605A;   /* board borders and dashes */
  --chalkboard-off:#5A4944;    /* disabled button on the board */
  --chalkboard-off-text:#A8968F;
  --soft:#F5EFED;              /* quiet buttons: a whisper of Mocha */
  --line:#ECE1DE;              /* thin borders and dividers */
  --tan:var(--soft);           /* (old name) quiet buttons */
  --tan-line:var(--line);      /* (old name) dividers */
  --white:#FFFFFF;
  --blush:#FFB8C8;             /* friendly error text on the dark board */
  --alert-dark:#6B2E3F;        /* setup-note box */
  --berry:#A8445F;             /* deeper rose for "sold out" and warnings (white text reads on it) */
  --stick-top:#EBCB92; --stick-bottom:#D9AE6A; --stick-edge:#B88B4A; /* popsicle sticks */
  --tint-HOT:#EFE4DB; --tint-ICE:#FFE4EA; --tint-BAK:#F8D8E1; --tint-other:#F3ECEA; /* tile backgrounds: Mocha, Strawberry, Rose */
  --shadow:rgba(59,42,38,.16);
  --scrim:rgba(40,26,23,.65);

  /* ---- Roles: which color does which job ---- */
  --bg:var(--milk-foam);        /* page background */
  --ink:var(--espresso);        /* main text, header bar, selected buttons */
  --board:var(--espresso-2);    /* sign-in screen */
  --accent:var(--rose-latte);   /* the ONE loud button: Charge */
  --pink:var(--strawberry-milk);/* gentle highlights: "running low", selected choices */
  --good:var(--soft);           /* "all good" chips (calm on purpose) */
  --alert:var(--berry);         /* sold out, damaged, warnings */

  /* ---- Fonts (named font first, then offline-safe fallbacks) ---- */
  --font-display:"Fredoka","Chalkboard SE","Marker Felt","Avenir Next Rounded",ui-rounded,system-ui,sans-serif;
  --font-body:"Nunito","Avenir Next",-apple-system,system-ui,sans-serif;

<style>
/* Layout and components. Colors come from the THEME block above.
   Calm rules: flat surfaces, 1px lines, one loud button (Charge),
   round display font only for the logo, totals and "Sale done!". */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:auto;user-select:auto}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:19px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#app{height:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.logo{background:var(--logo-url) center/contain no-repeat;aspect-ratio:1/1;flex:none}
.logo.hdr{height:var(--logo-header-size)}
.logo.big{height:var(--logo-login-size);margin-bottom:4px}
.logo.full{background-image:var(--logo-full-url);aspect-ratio:814/638;height:var(--logo-login-size);margin-bottom:10px}
/* sign in */
.login{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--board);color:var(--chalk);text-align:center}
.login h1{font-family:var(--font-display);font-size:48px;font-weight:600;margin:0}
.closedtag{display:inline-block;margin:0 0 4px;padding:6px 16px;border-radius:999px;border:1px solid var(--chalkboard-line);font-size:17px;font-weight:700;letter-spacing:.02em}
.dots{display:flex;gap:18px;height:30px;margin:8px 0}
.dots i{width:22px;height:22px;border-radius:50%;border:2px solid var(--chalk)}
.dots i.on{background:var(--chalk)}
.msg{height:26px;font-size:20px;color:var(--blush)}
.pad{display:grid;grid-template-columns:repeat(3,96px);gap:12px}
.pad button{height:80px;border-radius:16px;background:var(--chalkboard-2);color:var(--chalk);font-size:32px;font-weight:600;border:1px solid var(--chalkboard-line)}
.pad button:active{background:var(--chalk);color:var(--ink)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.setup{max-width:560px;margin-top:8px;padding:8px 14px;border-radius:10px;background:var(--alert-dark);font-size:16px;text-align:left}
/* top bar */
.reg{height:100%;display:grid;grid-template-columns:1fr 360px;grid-template-rows:auto 1fr}
header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--ink);color:var(--chalk)}
header h2{font-size:23px;font-weight:700;margin:0;flex:1;letter-spacing:.01em}
header .who{font-size:17px;opacity:.8}
.hbtn{padding:0 16px;border-radius:12px;background:transparent;color:var(--chalk);font-size:17px;font-weight:700;min-height:48px;border:1px solid var(--chalkboard-line)}
.hbtn:active{background:var(--chalkboard-2)}
.hbtn.sun{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}
.warn{background:var(--alert);color:#fff;padding:10px 18px;font-size:16px;font-weight:700}
.warn.low{background:var(--pink);color:var(--ink)}
.warn.closed{background:var(--soft);color:var(--ink);display:flex;align-items:center;gap:14px;justify-content:space-between}
/* products */
.shop{display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:6px;padding:10px 16px 0;border-bottom:1px solid var(--line)}
.tabs button{min-height:52px;padding:0 18px;background:none;font-size:19px;font-weight:700;opacity:.6;border-bottom:3px solid transparent;border-radius:0}
.tabs button.on{opacity:1;border-bottom-color:var(--ink)}
.grid{flex:1;overflow:auto;padding:4px 16px 16px}
.sect{display:flex;align-items:center;gap:8px;margin:14px 2px 8px;font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mocha)}
.sect i{width:10px;height:10px;border-radius:50%;display:inline-block}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.tile{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px 10px 12px;text-align:center;position:relative}
.tile:active{background:var(--soft)}
.tile.out{opacity:.45}
.tile .pic{height:84px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.tile svg{width:76px;height:76px}
.tile b{display:block;font-size:19px;font-weight:700;margin:6px 4px 2px}
.tile .price{display:block;font-size:17px;font-weight:600;color:var(--mocha)}
.tile small{display:block;margin-top:4px;font-size:12px;opacity:.4;letter-spacing:.06em}
.tile .qty{position:absolute;top:8px;right:8px;min-width:30px;height:30px;padding:0 8px;border-radius:15px;background:var(--ink);color:var(--chalk);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center}
.tile .stk{position:absolute;top:8px;left:8px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:800}
.tile .stk.low{background:var(--pink)}
.tile .stk.out{background:var(--alert);color:#fff}
/* order panel */
.cart{background:var(--white);color:var(--ink);display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line)}
.cart h3{font-size:15px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mocha);margin:0;padding:18px 18px 6px}
.lines{flex:1;overflow:auto;padding:0 18px}
.empty{padding:40px 10px;text-align:center;font-size:18px;opacity:.5}
.line{display:grid;grid-template-columns:1fr auto;gap:6px 8px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.line .n{font-weight:700;font-size:18px}.line .n small{display:block;font-weight:600;font-size:12px;opacity:.45;letter-spacing:.04em}
.line .n small.over{color:var(--alert);opacity:1;font-size:13px}
.line .t{font-size:18px;font-weight:700;text-align:right}
.step{display:flex;align-items:center;gap:8px}
.step button{width:46px;height:46px;border-radius:12px;background:var(--white);border:1px solid var(--line);font-size:24px}
.step button:active{background:var(--soft)}
.step span{min-width:28px;text-align:center;font-size:19px;font-weight:700}
.foot{padding:14px 18px 18px;border-top:1px solid var(--line)}
.total{display:flex;justify-content:space-between;align-items:baseline;font-size:18px;font-weight:700;margin-bottom:12px}
.total b{font-family:var(--font-display);font-weight:600;font-size:40px}
.big{width:100%;min-height:68px;border-radius:14px;background:var(--accent);color:var(--ink);font-size:24px;font-weight:800;letter-spacing:.01em}
.big:active{filter:brightness(.95)}
.big:disabled{background:var(--soft);color:var(--chalkboard-off-text)}
.link{display:block;margin:8px auto 0;background:none;color:var(--ink);opacity:.55;font-size:16px;text-decoration:underline;min-height:42px}
/* pop-ups */
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:var(--scrim);z-index:9;padding:16px}
#modal.show{display:flex}
.card{background:var(--white);border-radius:18px;padding:24px;width:100%;max-width:560px;max-height:100%;overflow:auto;text-align:center}
.card.wide{max-width:760px}
.card h3{font-size:26px;font-weight:800;margin:0 0 8px}
.card h3.hero{font-family:var(--font-display);font-weight:600;font-size:36px}
.card p{margin:6px 0}
.bigmoney{font-family:var(--font-display);font-weight:600;font-size:52px;margin:4px 0}
.row{display:flex;gap:10px;margin-top:14px}.row>*{flex:1}
.btn{min-height:60px;border-radius:12px;background:var(--soft);font-size:20px;font-weight:700;padding:0 14px}
.btn:active{filter:brightness(.96)}
.btn.go{background:var(--ink);color:var(--chalk)}.btn.sun{background:var(--pink)}.btn.bad{background:var(--alert);color:#fff}
.btn:disabled{opacity:.4}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.npad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.npad button{min-height:60px;border-radius:12px;background:var(--white);border:1px solid var(--line);font-size:26px;font-weight:600}
.npad button:active{background:var(--soft)}
.sticks{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:10px 0;min-height:48px}
.stick{width:12px;height:44px;border-radius:6px;background:linear-gradient(var(--stick-top),var(--stick-bottom));border:1px solid var(--stick-edge)}
.sales{text-align:left;margin-top:10px}
.sale{padding:10px 2px;border-bottom:1px solid var(--line);font-size:17px}.sale b{font-weight:800}
.sale small{display:block;opacity:.65;font-size:15px}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800;background:var(--alert);color:#fff;margin-left:6px;vertical-align:middle}
/* returns */
.salebtn{display:block;width:100%;text-align:left;min-height:64px;border-radius:12px;background:var(--white);border:1px solid var(--line);padding:10px 16px;margin-bottom:8px;font-size:18px}
.salebtn:active{background:var(--soft)}
.salebtn small{display:block;opacity:.6;font-size:15px}
.rline{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:10px 2px;border-bottom:1px solid var(--line);text-align:left}
.rline b{font-size:19px;font-weight:800}
.rline small{display:block;opacity:.6;font-size:14px}
.mstep{display:flex;align-items:center;gap:8px}
.mstep button{width:52px;height:52px;border-radius:12px;background:var(--soft);font-size:26px}
.mstep button:disabled{opacity:.35}
.mstep span{min-width:36px;text-align:center;font-size:22px;font-weight:800}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.rsn{min-height:80px;border-radius:14px;background:var(--white);border:1px solid var(--line);font-size:20px;font-weight:700;padding:8px}
.rsn small{display:block;font-size:14px;font-weight:600;opacity:.6;margin-top:2px}
.rsn.on{background:var(--ink);color:var(--chalk);border-color:var(--ink)}
.rsn.on.noback{background:var(--alert);border-color:var(--alert);color:#fff}
.err{color:var(--alert);font-weight:800;min-height:24px}
/* back office */
.office{height:100%;display:flex;flex-direction:column}
.otabs{display:flex;gap:2px;padding:6px 14px 0;overflow-x:auto;flex:none;border-bottom:1px solid var(--line)}
.otabs button{flex:0 0 auto;min-height:52px;padding:0 14px;background:none;font-size:17px;font-weight:700;opacity:.55;border-bottom:3px solid transparent;border-radius:0}
.otabs button.on{opacity:1;border-bottom-color:var(--ink)}
#omain{flex:1;overflow:auto;padding:14px;-webkit-overflow-scrolling:touch;background:var(--bg)}
.panel{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.panel h3{font-size:22px;font-weight:800;margin:0 0 6px}
.panel p{margin:6px 0}
.hint{font-size:15px;opacity:.65}
.scroll{overflow-x:auto}
.tbl{min-width:780px}
.trow{display:grid;grid-template-columns:minmax(220px,2.4fr) repeat(5,minmax(70px,1fr)) minmax(80px,1.1fr) minmax(120px,1.2fr);gap:8px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line);font-size:19px;text-align:center}
.trow.head{font-size:13px;font-weight:800;opacity:.6;letter-spacing:.06em;text-transform:uppercase;position:sticky;top:0;background:var(--white);z-index:1}
.trow .nm{display:flex;align-items:center;gap:10px;text-align:left;font-weight:700}
.trow .nm small{display:block;font-weight:600;font-size:12px;opacity:.5}
.trow .on{font-size:24px;font-weight:800}
.mini svg{width:40px;height:40px;display:block}
.mini{width:48px;height:48px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.cellbtn{min-height:50px;min-width:70px;border-radius:10px;background:var(--white);font:inherit;font-weight:800;border:1px solid var(--line)}
.chip{display:inline-block;border-radius:999px;padding:5px 12px;font-weight:800;font-size:15px;background:var(--soft)}
.chip.ok{background:var(--good)}.chip.low{background:var(--pink)}.chip.out,.chip.bad{background:var(--alert);color:#fff}
.neg{color:var(--alert);font-weight:800}
.crow{display:grid;grid-template-columns:minmax(200px,2fr) 90px 130px minmax(130px,1.2fr);gap:10px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--line);font-size:19px;text-align:center}
.crow .nm{display:flex;align-items:center;gap:10px;text-align:left;font-weight:700}
.crow .nm small{display:block;font-weight:600;font-size:12px;opacity:.5}
.crow .reasons{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start;padding-left:58px}
.rbtn{min-height:50px;padding:0 16px;border-radius:10px;background:var(--soft);font-weight:700;font-size:17px}
.rbtn.on{background:var(--ink);color:var(--chalk)}
.rsrow{display:grid;grid-template-columns:minmax(200px,2fr) 90px auto;gap:10px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line);font-size:19px}
.rsrow .nm{display:flex;align-items:center;gap:10px;font-weight:700}
.rsrow .nm small{display:block;font-weight:600;font-size:12px;opacity:.5}
.rsrow .mstep{justify-content:flex-end}
.rsrow .mstep .plus5{width:64px;font-size:19px;font-weight:800}
.datein{font:inherit;font-size:20px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--white);min-height:54px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:8px 0}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:30px;font-weight:800}
.stat span{font-size:14px;font-weight:700;opacity:.65}
.bar{position:sticky;bottom:0;background:var(--white);padding:12px 0 4px;display:flex;gap:10px}
.bar>*{flex:1}
.rec{padding:10px 4px;border-bottom:1px solid var(--line);font-size:17px;text-align:left}
.rec b{font-weight:800}
.rec small{display:block;opacity:.65;font-size:14px}
button.rec{display:block;width:100%;background:none;border-radius:0}
button.rec:active{background:var(--soft)}
.sync{display:inline-block;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:800;white-space:nowrap}
.sync.ok{background:transparent;color:var(--chalk);opacity:.75}.sync.wait{background:var(--pink);color:var(--ink)}.sync.busy{background:var(--chalkboard-2);color:var(--chalk)}.sync.off{background:transparent;color:var(--chalk);opacity:.6}
code{font-size:.85em;background:var(--soft);padding:1px 6px;border-radius:6px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--chalk);padding:12px 24px;border-radius:999px;font-size:19px;font-weight:700;z-index:20;display:none;max-width:90%;text-align:center}
.grp{font-size:19px;font-weight:800;padding:14px 6px 6px;margin-top:6px}
.grp small{font-size:13px;font-weight:700;opacity:.55;margin-left:8px}
.rsn small.gone{color:var(--alert);opacity:1}
.rsn .bi{display:inline-block;width:42px;height:42px;vertical-align:middle;margin-right:8px}
.rsn .bi svg{width:100%;height:100%;display:block}
/* reports */
.rep{text-align:left}
.rep .sub{opacity:.6;font-size:15px;margin-bottom:10px}
.rep h4{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mocha);margin:16px 0 6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:0}
.kv b{padding-left:12px}
.kv span,.kv b{padding:7px 0;border-bottom:1px solid var(--line);font-size:17px}
.kv b{text-align:right}
.kv .em{font-size:19px;font-weight:800}
.menu-list{display:grid;gap:10px;margin-top:8px}
.menu-list .btn{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;min-height:76px;padding:10px 18px;background:var(--white);border:1px solid var(--line)}
.menu-list .btn small{font-size:15px;font-weight:600;opacity:.6}
.menu-list .btn:disabled{opacity:.35}
@media (orientation:portrait){
 .reg{grid-template-columns:1fr;grid-template-rows:auto 1fr 40%}
 .cart{border-left:0;border-top:1px solid var(--line)}
 .cart h3{padding:10px 18px 2px}
}

<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<script>
/* ============================================================
   EDIT ME: everything you will change later lives in CONFIG.
   - Prices are WHOLE popsicle sticks.
   - Every PIN must be exactly 4 digits and different from the others.
   - SKU prefix (HOT / ICE / BAK) must match a key in "lines".
   - "color" is the flavor color drawn on the picture tile.
   - "icon" can be: mug, iced, cookie, muffin
   - "stock" is the STARTING stock (pieces printed before opening).
     The manager can change it later on the Stock screen.
   - "low" (optional) overrides lowStock for one item.

   THREE WAYS TO DO FLAVORS AND LATTE ART:
   Way 1: every flavor is its own item with its own SKU (HOT-001 Latte Mug,
          HOT-002 Mocha Mug ...). Stock is per item.
   Way 2: one item with an "options" list where each combo is a separate piece
          (a Mocha with a Star is a different print than a Mocha with a Flower).
          Every combo gets its own stock and its own variant SKU, like
          HOT-001-MOC-STR. See HOT-001 below.

/* ===================== end of CONFIG =====================

const KEY = "coffee-clicker-pos-v1";   // same key as Phase 1, so test sales carry over

/* Every thing we count is a "stock entity": a plain item, or one combo of an item with options. */
function combosOf(item) {
  let out = [{ codes: [], names: [], color: null, art: null }];

/* Builds ITEMS and STOCK from CONFIG. Runs at start and again whenever a new menu arrives from the Sheet. */

  ITEMS.forEach(i => {
    if (i.options.length && i.trackStock !== "item") {
      combosOf(i).forEach(c => { const code = c.codes.join("-"), cs = i.comboStock && i.comboStock[code];

    } else STOCK.push({ ...i, parent: i.sku, variant: null });

}

/* ---------- stock (always figured out from the saved records) ---------- */

  <section class="shop">${canSave ? "" : '<div class="warn">Saving is off in this browser. Sales will be lost when the page closes.</div>'}<div id="closedbar"></div><div id="lowbar"></div><div class="tabs" id="tabs"></div><div class="grid" id="grid"></div></section>

  drawTabs(); drawCart(); drawChip();
}
const TABS_OVER = 12;   // tabs appear only when more than this many items are on the menu
function drawTabs() {
  const big = ITEMS.filter(onMenu).length > TABS_OVER, el = $("#tabs");
  el.style.display = big ? "" : "none"; if (!big) { tab = "ALL"; el.innerHTML = ""; return; }

}
const cartQty = sku => Object.entries(cart).reduce((s, [k, q]) => s + (parseKey(k).sku === sku ? q : 0), 0);   // one stock SKU
const cartQtyParent = sku => Object.entries(cart).reduce((s, [k, q]) => s + (itemOf(parseKey(k).sku).parent === sku ? q : 0), 0);   // whole menu item
function tileStock(i, m) { return STOCK.filter(x => x.parent === i.sku && isActive(x, m[x.sku])).reduce((a, x) => a + m[x.sku].on, 0); }
function drawGrid() {

  <div class="pic">${icon(i.icon, i.color)}</div><b>${esc(i.name)}</b><span class="price">${sticks(i.price)}</span><small>${esc(i.sku)}</small></button>`;
  };
  $("#grid").innerHTML = lines.map(l => { const its = shown.filter(i => i.line === l); return its.length ? `<div class="sect"><i style="background:${lineDot(l)}"></i>${esc(CONFIG.lines[l] || l)}</div><div class="tiles">${its.map(tileOf).join("")}</div>` : ""; }).join("");
  const cb = $("#closedbar");
  if (cb) cb.innerHTML = dayOpen() ? "" : `<div class="warn closed"><span><b>The register is closed.</b> Open it to start selling.</span>${isAdmin() ? '<button class="btn go" data-act="dopen" style="min-height:48px">Open register</button>' : ""}</div>`;
  const lb = $("#lowbar");

    lb.innerHTML = l.length ? `<div class="warn low">Stock check: ${l.slice(0, 6).map(x => esc(dispName(x.i)) + " (" + (x.on <= 0 ? "sold out" : x.on + " left") + ")").join(", ")}${l.length > 6 ? " and " + (l.length - 6) + " more" : ""}</div>` : "";

const total = () => Object.entries(cart).reduce((s, [k, q]) => s + q * itemOf(parseKey(k).sku).price, 0);

  const e = Object.entries(cart), m = stockMap();
  $("#lines").innerHTML = e.length ? e.map(([k, q]) => {

   <div class="step"><button data-act="dec" data-k="${esc(k)}">&minus;</button><span>${q}</span><button data-act="inc" data-k="${esc(k)}">+</button></div></div>`;

function addToCart(k) { cart[k] = Math.min(99, (cart[k] || 0) + 1); drawCart(); }
const optItem = sku => ITEMS.find(i => i.sku === sku);
let pk = null;
function openPicker(sku) { pk = { item: optItem(sku), picks: [] }; drawPicker(); }
function drawPicker() {
  const it = pk.item, step = pk.picks.length, o = it.options[step], m = stockMap(), perCombo = it.trackStock !== "item";
  const pc = pk.picks.map(v => v.code), mine = STOCK.filter(e => e.parent === it.sku && e.isVariant), anyActive = mine.some(e => isActive(e, m[e.sku]));

  <div class="rgrid">${vals.map(x => `<button class="rsn" data-act="pickv" data-i="${o.values.indexOf(x.v)}">${x.v.art ? `<span class="bi">${icon(it.icon, col, x.v.art)}</span>` : x.v.color ? `<span style="display:inline-block;width:26px;height:26px;border-radius:50%;background:${esc(x.v.color)};border:3px solid var(--ink);vertical-align:-5px;margin-right:8px"></span>` : ""}${esc(x.v.name)}${x.n == null ? "" : `<small class="${x.n ? "" : "gone"}">${x.n ? x.n + " left" : "Sold out"}</small>`}</button>`).join("")}</div>

/* ---------- payment ---------- */
function openModal(h, wide) { $("#modal").innerHTML = '<div class="card' + (wide ? " wide" : "") + '">' + h + "</div>"; $("#modal").classList.add("show"); }

/* ---------- returns ---------- */
const returnedFor = (saleId, k) => store.returns.filter(r => r.saleId === saleId && keyOf(r) === k).reduce((s, r) => s + r.qty, 0);
const saleReturns = () => { const m = {}; store.returns.forEach(r => { if (r.saleId) { const x = m[r.saleId] = m[r.saleId] || { qty: 0, sticks: 0 }; x.qty += r.qty; x.sticks += r.sticks; } }); return m; };
function startReturn() { ret = { step: "find", sale: null, picks: {}, reason: null, num: "", err: "", done: null }; drawReturn(); }
const retLines = () => ret.sale
  ? ret.sale.lines.map(l => ({ k: keyOf(l), unit: l.sticks, max: l.qty - returnedFor(ret.sale.id, keyOf(l)), bought: l.qty, did: returnedFor(ret.sale.id, keyOf(l)) }))
  : activeStock(stockMap()).map(e => ({ k: e.sku, unit: e.price, max: 20, bought: null, did: 0 }));
const refundTotal = () => retLines().reduce((s, l) => s + (ret.picks[l.k] || 0) * l.unit, 0);

    const recent = store.sales.slice().reverse().slice(0, 8);
    openModal(`<h3>Return</h3><p>Which sale is it from?</p><div class="sales">${recent.map(x => `<button class="salebtn" data-act="rsale" data-id="${esc(x.id)}"><b>Sale #${x.no} &middot; ${sticks(x.total)}</b><small>${fmtTime(x.time)} &middot; ${x.lines.map(l => l.qty + " x " + esc(dispName(itemOf(l.sku))) + (l.flavor ? " (" + esc(l.flavor) + ")" : "")).join(", ")}</small></button>`).join("") || "<p>No sales yet.</p>"}</div>
    <div class="row"><button class="btn" data-act="rnum">Type a sale number</button><button class="btn" data-act="rnosale">No sale number</button></div>
    <div class="row"><button class="btn" data-act="rcancel">Cancel</button></div>`, true);
  } else if (s === "num") {
    openModal(`<h3>Sale number</h3><div class="bigmoney">${ret.num ? "#" + ret.num : "#?"}</div><div class="err">${esc(ret.err)}</div>
    <div class="npad">${[1,2,3,4,5,6,7,8,9].map(d => `<button data-act="rkey" data-d="${d}">${d}</button>`).join("")}<button data-act="rclr">C</button><button data-act="rkey" data-d="0">0</button><button data-act="rbk">&#9003;</button></div>

      return `<div class="rline"><div><b>${esc(lineName(l.k))}</b><small>${esc(parseKey(l.k).sku)} &middot; ${sub}</small></div>

      saleId: ret.sale ? ret.sale.id : null, saleNo: ret.sale ? ret.sale.no : null, sku: p.sku, label: lineName(l.k), flavor: p.flavor, qty: q, unit: l.unit, sticks: st, reason: reason.id, restocked: reason.restock });

/* ============================================================
   OPEN / CLOSE THE REGISTER (like a real store)
   Open:  count the starting sticks in the drawer (the "float").
   Close: count the drawer WITHOUT seeing the answer first (a "blind count"),
          then the register shows expected vs counted (over / short) and the
          end-of-day report. Every sale and return is stamped with its day.
   Expected in drawer = starting sticks + sticks from sales - sticks refunded.
   ============================================================ */
const dayOpen = () => (store.days || []).find(d => !d.closedAt) || null;
function daySummary(d) {
  const S = store.sales.filter(x => x.day === d.id), R = store.returns.filter(x => x.day === d.id);
  const taken = S.reduce((a, x) => a + x.total, 0), refunds = R.reduce((a, x) => a + x.sticks, 0);
  const items = {}, byCashier = {};
  S.forEach(x => { byCashier[x.cashier] = (byCashier[x.cashier] || 0) + x.total;
    x.lines.forEach(l => { const k = l.label || l.sku; const it = items[k] = items[k] || { qty: 0, sticks: 0 }; it.qty += l.qty; it.sticks += l.qty * l.sticks; }); });
  const list = Object.entries(items).sort((a, b) => b[1].qty - a[1].qty || b[1].sticks - a[1].sticks).map(([name, v]) => ({ name, qty: v.qty, sticks: v.sticks }));
  return { sales: S.length, itemsSold: S.reduce((a, x) => a + x.lines.reduce((b, l) => b + l.qty, 0), 0), taken,
    returns: new Set(R.map(x => x.no)).size, refundSticks: refunds, net: taken - refunds, expected: d.float + taken - refunds,
    best: list.length ? list[0].name : "", items: list, byCashier };
}
const overShort = n => n === 0 ? '<span class="chip ok">Matches!</span>' : n > 0 ? `<span class="chip low">${sticks(n)} over</span>` : `<span class="chip bad">${sticks(-n)} short</span>`;
const drawerReason = id => { const r = [...CONFIG.drawerReasons.short, ...CONFIG.drawerReasons.over].find(x => x.id === id); return r ? r.label : id || ""; };
function reportHTML(d, live) {
  const m = live ? daySummary(d) : d.summary, kv = (k, v, em) => `<span class="${em ? "em" : ""}">${k}</span><b class="${em ? "em" : ""}">${v}</b>`;
  const head = `Day #${d.no} &middot; ${fmtDateKey(d.date)} &middot; opened ${fmtTime(d.openedAt)} by ${esc(d.openedBy)}` + (d.closedAt ? ` &middot; closed ${fmtTime(d.closedAt)} by ${esc(d.closedBy)}` : " &middot; still open");
  return `<div class="rep"><div class="sub">${head}</div>
  <h4>Sales</h4><div class="kv">${kv("Sales", m.sales)}${kv("Items sold", m.itemsSold)}${kv("Sticks taken in", m.taken)}${kv("Refunds (" + m.returns + ")", m.refundSticks ? "&minus;" + m.refundSticks : 0)}${kv("Net sales", sticks(m.net), 1)}</div>
  <h4>Drawer</h4><div class="kv">${kv("Starting sticks", d.float)}${kv("+ Sticks from sales", m.taken)}${kv("&minus; Sticks refunded", m.refundSticks)}${kv("Should be in the drawer", sticks(m.expected), 1)}
  ${d.closedAt ? kv("Counted", sticks(d.counted)) + kv("Over / short", overShort(d.diff)) + (d.diff ? kv("Why", esc(drawerReason(d.reason))) : "") : ""}</div>
  ${m.items.length ? `<h4>Best sellers</h4><div class="kv">${m.items.slice(0, 10).map(it => kv(esc(it.name), it.qty + " sold &middot; " + sticks(it.sticks))).join("")}</div>` : ""}
  ${Object.keys(m.byCashier).length ? `<h4>By cashier</h4><div class="kv">${Object.entries(m.byCashier).map(([c, v]) => kv(esc(c), sticks(v))).join("")}</div>` : ""}</div>`;
}
function adminMenu() {
  const d = dayOpen();
  openModal(`<h3>Admin</h3><p class="hint">${d ? "Register open since " + fmtTime(d.openedAt) + " &middot; started with " + sticks(d.float) : "The register is closed."}</p>
  <div class="menu-list"><button class="btn" data-act="dopen" ${d ? "disabled" : ""}>Open register<small>Count the starting sticks in the drawer</small></button>
  <button class="btn" data-act="dclose" ${d ? "" : "disabled"}>Close register<small>Count the drawer and see today's report</small></button>
  <button class="btn" data-act="dtoday" ${d ? "" : "disabled"}>Today so far<small>A peek at today's sales</small></button></div>
  <div class="row"><button class="btn" data-act="close">Back</button></div>`);
}

let cl = null;   // closing in progress: { counted, reason }
function closeDay() {

/* ---- End-of-day count ---- */
function countRows() {

/* ---- Shrinkage ---- */
function shrinkData() {
  const by = {}, sku = {}; let extra = 0;
  const add = (id, label, s, q) => { by[id] = by[id] || { label, q: 0 }; by[id].q += q; const k = sku[s] = sku[s] || { q: 0, parts: {} }; k.q += q; k.parts[label] = (k.parts[label] || 0) + q; };
  store.returns.filter(r => !r.restocked).forEach(r => add("damaged-return", "Damaged returns", r.sku, r.qty));
  store.counts.forEach(c => c.rows.forEach(w => { if (w.diff < 0) add(w.reason || "lost", reasonLabel(w.reason || "lost"), w.sku, -w.diff); else if (w.diff > 0) extra += w.diff; }));
  return { by, sku, extra, units: Object.values(by).reduce((a, b) => a + b.q, 0), worth: Object.entries(sku).reduce((a, [s, v]) => a + v.q * itemOf(s).price, 0) };
}
function tShrink() {
  const d = shrinkData();
  const cards = Object.values(d.by).sort((a, b) => b.q - a.q).map(b => `<div class="stat"><b>${b.q}</b><span>${esc(b.label)}</span></div>`).join("");
  const rows = Object.entries(d.sku).sort((a, b) => b[1].q - a[1].q).map(([s, v]) => `<div class="rec"><b>${esc(dispName(itemOf(s)))}</b> &middot; ${v.q} lost (${sticks(v.q * itemOf(s).price)} of sales)<small>${esc(s)} &middot; ${Object.entries(v.parts).map(([k, q]) => esc(k) + " " + q).join(", ")}</small></div>`).join("");
  const hist = store.counts.slice().reverse().map(c => { const sh = c.rows.filter(r => r.diff < 0).reduce((a, r) => a + -r.diff, 0), ex = c.rows.filter(r => r.diff > 0).reduce((a, r) => a + r.diff, 0);
    return `<div class="rec"><b>Count #${c.no}</b> <small>${fmtDateKey(c.date)} at ${fmtTime(c.time)} by ${esc(c.by)} &middot; ${c.rows.length} items &middot; ${sh} short, ${ex} extra</small></div>`; }).join("");
  return `<div class="panel"><h3>Shrinkage: where did pieces go?</h3>
  <div class="stats"><div class="stat"><b>${d.units}</b><span>pieces lost</span></div><div class="stat"><b>${d.worth}</b><span>${CONFIG.unit[1]} of sales lost</span></div><div class="stat"><b>${d.extra}</b><span>found extra</span></div></div>

  ${rows ? `<div class="panel"><h3>By item</h3>${rows}</div>` : ""}<div class="panel"><h3>Count history</h3>${hist || "<p>No counts saved yet.</p>"}</div>`;
}

/* ============================================================
   PHASE 3: GOOGLE SHEET (menu down, records up)
   Records are saved on the iPad FIRST. The sync only copies them to the Sheet.
   A record counts as sent only after the Sheet says it saved it (or already had it),
   so wifi drops never lose anything: unsent records just wait and go next time.
   ============================================================ */
const syncOn = () => /^https:\/\//.test(CONFIG.sync.url || "");
const SYNC_KINDS = [["sales", "sales"], ["returns", "returns"], ["restocks", "restocks"], ["counts", "counts"], ["startLog", "start"], ["days", "days"]];
let sy = { busy: false, err: null, menuErr: null, menuBusy: false, check: null, timer: null };
function unsent() {
  const out = [];
  SYNC_KINDS.forEach(([k, type]) => (store[k] || []).forEach(r => { if (r && r.id && !store.sent[r.id] && !store.syncBad[r.id] && (type !== "days" || r.closedAt)) out.push({ type, r }); }));
  return out;
}
function outgoing(x) {   // add readable names so the Sheet rows make sense on their own
  const o = { type: x.type, ...x.r };
  if (x.type === "restocks" || x.type === "start") o.label = dispName(itemOf(o.sku));
  if (x.type === "days") { const m = o.summary || {}; delete o.summary;
    Object.assign(o, { sales: m.sales, itemsSold: m.itemsSold, taken: m.taken, returns: m.returns, refundSticks: m.refundSticks, net: m.net, best: m.best, reasonLabel: o.reason ? drawerReason(o.reason) : "" }); }
  if (x.type === "counts") o.rows = (o.rows || []).map(w => ({ ...w, label: dispName(itemOf(w.sku)) }));
  return o;
}
async function sheetCall(params, body) {
  const ctl = typeof AbortController === "function" ? new AbortController() : null, t = ctl && setTimeout(() => ctl.abort(), 25000);
  try {
    const url = CONFIG.sync.url + (params ? (CONFIG.sync.url.includes("?") ? "&" : "?") + params : "");
    const r = await fetch(url, body ? { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body), redirect: "follow", signal: ctl && ctl.signal }
                                    : { redirect: "follow", signal: ctl && ctl.signal });
    const txt = await r.text();
    let j; try { j = JSON.parse(txt); } catch (e) { throw new Error("The Sheet sent back something unexpected. Check the web app URL, and that access is set to Anyone."); }
    if (!j.ok) throw new Error(j.error === "bad key" ? "The Sheet did not accept the key. CONFIG.sync.key must match SECRET in the Apps Script." : (j.error || "The Sheet said no."));
    return j;
  } catch (e) {
    if (e && e.name === "AbortError") throw new Error("The Sheet took too long to answer.");
    if (e instanceof TypeError) throw new Error(navigator.onLine === false ? "No wifi right now." : "Could not reach the Sheet.");
    throw e;
  } finally { t && clearTimeout(t); }
}
function syncSoon() { if (!syncOn()) return; clearTimeout(sy.timer); sy.timer = setTimeout(syncNow, 1500); }
async function syncNow() {
  if (!syncOn() || sy.busy) return;
  const q = unsent();
  if (!q.length) { sy.err = null; drawSyncBits(); return; }
  sy.busy = true; drawSyncBits();
  try {
    for (let i = 0; i < q.length; i += 50) {
      const res = await sheetCall(null, { key: CONFIG.sync.key, device: store.device, records: q.slice(i, i + 50).map(outgoing) });
      [...(res.saved || []), ...(res.dup || [])].forEach(id => store.sent[id] = 1);
      (res.bad || []).forEach(id => store.syncBad[id] = 1);
      store.lastSync = new Date().toISOString(); persist();
    }
    sy.err = null;
  } catch (e) { sy.err = e.message || "Could not reach the Sheet."; }
  sy.busy = false; persist(); drawSyncBits();
}
async function fetchMenu(manual) {
  if (!syncOn() || sy.menuBusy) return;
  sy.menuBusy = true; if (manual) drawSyncBits();
  try {
    const j = await sheetCall("action=menu&key=" + encodeURIComponent(CONFIG.sync.key));
    const prob = menuProblem(j.menu);
    if (prob) throw new Error(prob + " Keeping the menu the register already has.");
    if (!menuCache || menuCache.version !== j.version) {
      menuCache = { version: j.version, fetchedAt: new Date().toISOString(), menu: j.menu };
      try { localStorage.setItem(MENU_KEY, JSON.stringify(menuCache)); } catch (e) {}
    } else { menuCache.fetchedAt = new Date().toISOString(); try { localStorage.setItem(MENU_KEY, JSON.stringify(menuCache)); } catch (e) {} }
    sy.menuErr = null;
    if (menuWaiting()) {
      if (!user) { const p = pin; applyMenu(menuCache); showLogin(); pin = p; dots(); }   // nobody signed in: use it now (keeps a half-typed PIN)
      else if (manual) { applyMenu(menuCache); cart = {}; toast("New menu is in!"); }
      else toast("A new menu is ready. It starts at the next sign-in.");
    } else if (manual) toast("Menu is up to date");
  } catch (e) { sy.menuErr = e.message; if (manual) toast("Menu: " + e.message); }
  sy.menuBusy = false; drawSyncBits();
}
async function checkSheet() {
  sy.check = { busy: true }; drawSyncBits();
  try { const j = await sheetCall("action=ping&key=" + encodeURIComponent(CONFIG.sync.key) + "&device=" + encodeURIComponent(store.device));
        sy.check = { at: new Date().toISOString(), sheet: j.received, sent: Object.keys(store.sent).length }; }
  catch (e) { sy.check = { err: e.message }; }
  drawSyncBits();
}
function drawChip() {
  const c = $("#syncchip"); if (!c) return;
  if (!syncOn()) { c.innerHTML = isMgr() ? '<span class="sync off">Sheet sync off</span>' : ""; return; }
  const n = unsent().length;
  c.innerHTML = sy.busy ? '<span class="sync busy">Sending&hellip;</span>'
    : !n ? '<span class="sync ok">&#10003; Saved to Sheet</span>'
    : `<span class="sync wait">${n} waiting${sy.err ? " &middot; " + (navigator.onLine === false ? "no wifi" : "will retry") : ""}</span>`;
}
function drawSyncBits() { drawChip(); if ($("#omain") && (ost.tab === "sync" || ost.tab === "menu") && !$("#modal").classList.contains("show")) renderOffice(); }
const ago = t => { if (!t) return "never"; const s = Math.round((Date.now() - new Date(t)) / 1000); return s < 60 ? "just now" : s < 3600 ? Math.round(s / 60) + " min ago" : fmtDay(t) + " " + fmtTime(t); };

/* ---- Back office: Menu ---- */
function historySkus() {
  const known = new Set(STOCK.map(e => e.sku)), seen = {};
  store.sales.forEach(s => s.lines.forEach(l => seen[l.sku] = 1)); store.returns.forEach(r => seen[r.sku] = 1);
  store.restocks.forEach(r => seen[r.sku] = 1); store.counts.forEach(c => c.rows.forEach(w => seen[w.sku] = 1)); Object.keys(store.start).forEach(k => seen[k] = 1);
  return Object.keys(seen).filter(k => !known.has(k));
}
function tMenu() {
  const notes = setupNotes(), lost = historySkus(), off = ITEMS.filter(i => !onMenu(i));
  const src = menuInfo.source === "sheet" ? `From the Google Sheet (version ${esc(menuInfo.version)}), downloaded ${ago(menuCache && menuCache.fetchedAt)}.` : "Built-in menu from the register file." + (syncOn() ? " Tap Get latest menu to load the Sheet's menu." : " Turn on Sheet sync to load the menu from the Sheet.");
  const rows = ITEMS.map(i => { const n = STOCK.filter(e => e.parent === i.sku).length;
    return `<div class="rec"><b>${esc(i.sku)} &middot; ${esc(i.name)}</b> ${onMenu(i) ? "" : '<span class="chip">Off</span>'} <small>${esc(CONFIG.lines[i.line] || i.line)} &middot; ${sticks(i.price)} &middot; start ${i.stock}${i.options.length ? " &middot; " + i.options.map(o => esc(o.label) + ": " + o.values.map(v => esc(v.name)).join(", ")).join(" | ") + " &middot; " + (i.trackStock === "item" ? "one shared stock" : n + " combos counted") : ""}${i.cost != null ? " &middot; costs $" + Number(i.cost).toFixed(2) : ""}</small></div>`; }).join("");
  return `<div class="panel"><h3>Menu</h3><p>${src}</p>
  ${menuWaiting() ? '<p class="err">A newer menu has downloaded. It starts at the next sign-in, or tap Use it now.</p>' : ""}
  ${sy.menuErr ? `<p class="err">${esc(sy.menuErr)}</p>` : ""}
  <div class="row">${syncOn() ? `<button class="btn go" data-act="menufetch" ${sy.menuBusy ? "disabled" : ""}>${sy.menuBusy ? "Getting menu&hellip;" : "Get latest menu"}</button>` : ""}${menuWaiting() ? '<button class="btn sun" data-act="menuapply">Use it now</button>' : ""}</div>
  <p class="hint">Edit the menu on the Sheet's Menu and Options tabs, then tap Get latest menu. Once an item has sales, keep its SKU and codes the same. To stop selling something, untick On menu? instead of deleting the row, so old sales still have a name.</p></div>
  ${notes.length || lost.length ? `<div class="panel"><h3>Check these</h3>${notes.map(n => `<p class="err">${esc(n)}</p>`).join("")}${lost.length ? `<p class="err">These SKUs have sales or stock history but are not on the menu anymore: ${lost.map(esc).join(", ")}. Put them back (and untick On menu?) so their history keeps a name.</p>` : ""}</div>` : ""}
  <div class="panel"><h3>${ITEMS.length} items${off.length ? " (" + off.length + " switched off)" : ""}</h3>${rows}</div>`;
}

/* ---- Back office: Sheet sync ---- */
function tSync() {
  if (!syncOn()) return `<div class="panel"><h3>Sheet sync is off</h3><p>Everything is still saved on this iPad. To send it to the Google Sheet, paste the Apps Script <b>Web app URL</b> into <code>CONFIG.sync.url</code> at the top of the register file, then reload.</p><p class="hint">This iPad's ID: ${esc(store.device)}</p></div>`;
  const n = unsent().length, bad = Object.keys(store.syncBad).length, c = sy.check;
  const kinds = SYNC_KINDS.map(([k, t]) => { const L = (store[k] || []).filter(r => t !== "days" || r.closedAt), all = L.length, w = L.filter(r => !store.sent[r.id]).length; return `<div class="stat"><b>${all - w}/${all}</b><span>${{ sales: "sales", returns: "return lines", restocks: "restock lines", counts: "counts", start: "start changes", days: "closed days" }[t]} sent</span></div>`; }).join("");
  let chk = "";
  if (c && c.busy) chk = "<p>Asking the Sheet&hellip;</p>";
  else if (c && c.err) chk = `<p class="err">${esc(c.err)}</p>`;
  else if (c) chk = c.sheet >= c.sent ? `<p><span class="chip ok">All there</span> The Sheet has ${c.sheet} records from this iPad, and this iPad has sent ${c.sent}. (checked ${ago(c.at)})</p>`
    : `<p><span class="chip bad">Missing</span> The Sheet has only ${c.sheet} of the ${c.sent} records this iPad sent. That happens if rows were cleared in the Sheet. Tap Send everything again; the Sheet skips anything it already has.</p><div class="row"><button class="btn sun" data-act="resendall">Send everything again</button></div>`;
  return `<div class="panel"><h3>Sheet sync</h3>
  <div class="stats"><div class="stat"><b>${n}</b><span>waiting to send</span></div><div class="stat"><b>${ago(store.lastSync)}</b><span>last sent</span></div>${bad ? `<div class="stat"><b>${bad}</b><span>refused by Sheet</span></div>` : ""}</div>
  ${sy.err ? `<p class="err">${esc(sy.err)} Records are safe on this iPad and will send later.</p>` : n ? "" : "<p>Everything on this iPad is in the Sheet.</p>"}
  <div class="row"><button class="btn go" data-act="syncnow" ${sy.busy ? "disabled" : ""}>${sy.busy ? "Sending&hellip;" : "Send now"}</button><button class="btn" data-act="synccheck">Check the Sheet</button></div>${chk}
  <p class="hint">Sends on its own every ${CONFIG.sync.everySeconds} seconds and right after each sale. This iPad's ID: ${esc(store.device)}.</p></div>
  <div class="panel"><h3>What has been sent</h3><div class="stats">${kinds}</div></div>`;
}

/* ---- Restore from a backup file ---- */
function restoreFrom(text) {
  let d; try { d = JSON.parse(text); } catch (e) { toast("That file is not a register backup."); return; }
  if (!d || d.app !== "coffee-clicker-register" || !Array.isArray(d.sales)) { toast("That file is not a register backup."); return; }
  const when = d.exportedAt ? fmtDay(d.exportedAt) + " " + fmtTime(d.exportedAt) : "an unknown time";
  ask(`Replace everything on this iPad with the backup from ${when}? (${d.sales.length} sales)`, "Restore", () => {
    const s = blank(), arr = k => Array.isArray(d[k]) ? d[k] : [];
    s.device = typeof d.device === "string" ? d.device : store.device;
    ["sales", "returns", "restocks", "counts", "startLog", "days"].forEach(k => s[k] = arr(k));
    s.start = d.start && typeof d.start === "object" ? d.start : {};
    s.draft = d.draft && d.draft.counted ? d.draft : { counted: {}, reason: {} };
    const maxNo = (list, f) => list.reduce((a, x) => Math.max(a, Number(x[f]) || 0), 0);
    s.next = Math.max(Number(d.next) || 1, maxNo(s.sales, "no") + 1);
    s.nextRet = Math.max(Number(d.nextRet) || 1, maxNo(s.returns, "no") + 1);
    s.nextCount = Math.max(Number(d.nextCount) || 1, maxNo(s.counts, "no") + 1);
    s.nextDay = Math.max(Number(d.nextDay) || 1, maxNo(s.days, "no") + 1);
    s.sent = {};   // send it all again; the Sheet skips anything it already has
    store = s; persist();
    if (d.menuCache && d.menuCache.menu && !menuProblem(d.menuCache.menu)) { menuCache = d.menuCache; try { localStorage.setItem(MENU_KEY, JSON.stringify(menuCache)); } catch (e) {} applyMenu(menuCache); }
    closeModal(); renderOffice(); toast("Backup restored!"); syncSoon();
  });
}

/* ---- keep it moving ---- */
if (syncOn()) {
  setInterval(syncNow, Math.max(10, CONFIG.sync.everySeconds || 30) * 1000);
  setInterval(() => fetchMenu(false), 10 * 60 * 1000);
  window.addEventListener("online", () => { syncNow(); fetchMenu(false); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { syncNow(); fetchMenu(false); } });
  setTimeout(() => { syncNow(); fetchMenu(false); }, 800);
}

/* ---------- one click handler for everything ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const d = b.dataset, a = d.act;
  const redo = () => { if ($("#omain")) renderOffice(); };
  if (a === "key") { if (pin.length < 4) { pin += d.d; dots(); $("#pinmsg").textContent = ""; if (pin.length === 4) setTimeout(tryPin, 120); } }
  else if (a === "pback") { pin = pin.slice(0, -1); dots(); }
  else if (a === "pclear") { pin = ""; dots(); }
  else if (a === "tab") { tab = d.k; drawTabs(); drawGrid(); }
  else if (a === "add" && !dayOpen()) toast(isAdmin() ? "Open the register first (Admin)." : "The register is closed.");
  else if (a === "add") { const i = optItem(d.sku); i && i.options && i.options.length ? openPicker(d.sku) : addToCart(d.sku); }
  else if (a === "pickv") pickValue(parseInt(d.i, 10));
  else if (a === "pback2") { if (pk.picks.length) { pk.picks.pop(); drawPicker(); } else { pk = null; closeModal(); } }
  else if (a === "inc") { cart[d.k] = Math.min(99, (cart[d.k] || 0) + 1); drawCart(); }
  else if (a === "dec") { if (--cart[d.k] <= 0) delete cart[d.k]; drawCart(); }
  else if (a === "clearcart") ask("Clear this whole order?", "Clear it", () => { cart = {}; drawCart(); closeModal(); });
  else if (a === "charge") { tender = ""; payScreen(); }
  else if (a === "pkey") { if (tender.length < 3) { tender = (tender + d.d).replace(/^0+/, ""); payScreen(); } }
  else if (a === "pbk") { tender = tender.slice(0, -1); payScreen(); }
  else if (a === "pclr") { tender = ""; payScreen(); }
  else if (a === "exact") { tender = String(total()); payScreen(); }
  else if (a === "setpay") { tender = d.n; payScreen(); }
  else if (a === "done") completeSale();
  else if (a === "close") closeModal();
  else if (a === "yes") { const f = pending; pending = null; f && f(); }
  else if (a === "sales") salesSheet();
  else if (a === "backup") backup();
  else if (a === "reset") ask("Delete ALL test data on this iPad?", "Delete", () => { const keep = store.device; store = blank(); store.device = keep; save(); rs = null; closeModal(); renderOffice(); toast("Practice data cleared"); });
  else if (a === "lock") {
    const out = () => { closeModal(); showLogin(); };
    Object.keys(cart).length ? ask("Sign out? The open order will be cleared.", "Sign out", out) : out();
  }
  /* returns */
  else if (a === "return") { if (dayOpen()) startReturn(); else toast("Open the register first."); }
  /* open / close the register */
  else if (a === "admin") adminMenu();
  else if (a === "dopen") openDay();
  else if (a === "dclose") closeDay();
  else if (a === "dtoday") { const dd = dayOpen(); if (dd) openModal(`<h3>Today so far</h3>${reportHTML(dd, true)}<div class="row"><button class="btn go" data-act="close">Close</button></div>`, true); }
  else if (a === "dreason") { cl.reason = d.id; drawClose(); }
  else if (a === "drecount") { cl = null; closeDay(); }
  else if (a === "dcommit") commitClose();
  else if (a === "ddone") { closeModal(); if ($("#omain")) renderOffice(); else showLogin(); }
  else if (a === "dview") viewDay(d.id);
  else if (a === "repall") { ost.repDate = ""; renderOffice(); }
  else if (a === "rcancel") { ret = null; closeModal(); }
  else if (a === "rsale") { ret.sale = store.sales.find(s => s.id === d.id); ret.picks = {}; ret.step = "items"; drawReturn(); }
  else if (a === "rnosale") { ret.sale = null; ret.picks = {}; ret.step = "items"; drawReturn(); }
  else if (a === "rnum") { ret.step = "num"; ret.num = ""; ret.err = ""; drawReturn(); }
  else if (a === "rkey") { if (ret.num.length < 5) { ret.num = (ret.num + d.d).replace(/^0+/, ""); ret.err = ""; drawReturn(); } }
  else if (a === "rbk") { ret.num = ret.num.slice(0, -1); ret.err = ""; drawReturn(); }
  else if (a === "rclr") { ret.num = ""; ret.err = ""; drawReturn(); }
  else if (a === "rgo") { const s = store.sales.find(x => x.no === parseInt(ret.num, 10)); if (s) { ret.sale = s; ret.picks = {}; ret.step = "items"; } else ret.err = "No sale #" + ret.num + " on this iPad."; drawReturn(); }
  else if (a === "rback") { ret.step = ret.step === "reason" ? "items" : "find"; drawReturn(); }
  else if (a === "rinc") { const l = retLines().find(x => x.k === d.k); ret.picks[d.k] = Math.min(l.max, (ret.picks[d.k] || 0) + 1); drawReturn(); }
  else if (a === "rdec") { ret.picks[d.k] = Math.max(0, (ret.picks[d.k] || 0) - 1); drawReturn(); }
  else if (a === "rnext") { ret.step = "reason"; drawReturn(); }
  else if (a === "rreason") { ret.reason = d.id; drawReturn(); }
  else if (a === "rdone") finishReturn();
  else if (a === "rfinish") { ret = null; closeModal(); }
  /* number pad popup */
  else if (a === "nkey") { if (nm.fresh) { nm.v = ""; nm.fresh = false; } if (nm.v.length < 4) { nm.v = (nm.v + d.d).replace(/^0+(?=\d)/, ""); drawNum(); } }
  else if (a === "nbk") { nm.fresh = false; nm.v = nm.v.slice(0, -1); drawNum(); }
  else if (a === "nclr") { nm.v = ""; drawNum(); }
  else if (a === "nclose") { nm = null; closeModal(); }
  else if (a === "nok") { const f = nm.cb, v = parseInt(nm.v, 10); nm = null; closeModal(); f(v); }
  /* back office */
  else if (a === "office") showOffice("stock");
  else if (a === "toreg") showRegister();
  else if (a === "otab") { ost.tab = d.k; renderOffice(); $("#omain").scrollTop = 0; }
  else if (a === "editstart") numModal("Starting stock", dispName(itemOf(d.sku)) + " (" + d.sku + ")", startOf(d.sku), v => { const now = new Date(); store.start[d.sku] = { qty: v, time: now.toISOString(), by: user.name };
    store.startLog.push({ id: uid("ST"), time: now.toISOString(), date: localDate(now), device: store.device, by: user.name, sku: d.sku, qty: v }); save(); redo(); toast("Starting stock saved"); });
  else if (a === "rsinc") { rs.qty[d.sku] = Math.min(999, (rs.qty[d.sku] || 0) + parseInt(d.n, 10)); redo(); }
  else if (a === "rsdec") { rs.qty[d.sku] = Math.max(0, (rs.qty[d.sku] || 0) - 1); if (!rs.qty[d.sku]) delete rs.qty[d.sku]; redo(); }
  else if (a === "rsclear") { rs.qty = {}; redo(); }
  else if (a === "rssave") {
    const now = new Date(), batch = uid("B"), date = rs.date || localDate(now); let n = 0;
    Object.entries(rs.qty).forEach(([sku, q]) => { if (q > 0) { n += q; store.restocks.push({ id: uid("RS"), batch, time: now.toISOString(), date, device: store.device, by: user.name, sku, qty: q }); } });
    save(); rs = { date: localDate(), qty: {} }; redo(); toast(n + " pieces added to stock");
  }
  else if (a === "cnum") { const sku = d.sku, exp = stockMap()[sku].on; numModal("Count: " + dispName(itemOf(sku)), "The register expects " + exp + ". How many are on the shelf?", store.draft.counted[sku], v => { store.draft.counted[sku] = v; const ok = v === exp ? [] : (v < exp ? CONFIG.countReasons.short : CONFIG.countReasons.extra); if (!ok.some(o => o.id === store.draft.reason[sku])) delete store.draft.reason[sku]; save(); redo(); }); }
  else if (a === "callmatch") { countRows().filter(r => !r.has).forEach(r => { store.draft.counted[r.i.sku] = r.exp; }); save(); redo(); }
  else if (a === "creason") { store.draft.reason[d.sku] = d.id; save(); redo(); }
  else if (a === "cclear") ask("Clear the numbers you typed?", "Start over", () => { store.draft = { counted: {}, reason: {} }; save(); closeModal(); redo(); });
  /* menu, sheet sync, restore */
  else if (a === "menufetch") fetchMenu(true);
  else if (a === "menuapply") { applyMenu(menuCache); cart = {}; renderOffice(); toast("New menu is in!"); }
  else if (a === "syncnow") syncNow();
  else if (a === "synccheck") checkSheet();
  else if (a === "resendall") ask("Send every record on this iPad to the Sheet again? Rows it already has are skipped.", "Send again", () => { store.sent = {}; store.syncBad = {}; persist(); sy.check = null; closeModal(); syncNow(); });
  else if (a === "restorepick") { const f = $("#restorefile"); if (f) { f.value = ""; f.click(); } }
  else if (a === "csave") ask("Save this count? Stock will be set to the numbers you counted.", "Save count", saveCount);
});
document.addEventListener("change", e => {
  if (e.target.id === "rsdate" && rs) rs.date = e.target.value || localDate();
  if (e.target.id === "repdate") { ost.repDate = e.target.value || ""; renderOffice(); }
  if (e.target.id === "restorefile" && e.target.files && e.target.files[0]) { const r = new FileReader(); r.onload = () => restoreFrom(String(r.result)); r.readAsText(e.target.files[0]); }
});
showLogin();
</script>
